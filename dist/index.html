<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>To-Do List</title><script defer="defer" src="main.js"></script></head><body><div class="left-sidebar"><h3>Projects</h3><button id="theme-toggle">☀️ / 🌙</button><ul id="sidebar-projects"></ul><input id="project-item" placeholder="+ New Project"> <button id="add-project">Add</button></div><div class="content"><button id="new-task">+ New Task</button><div id="todo-list"></div><h5>made with ❤️ by Armando © 2026</h5></div><dialog id="new-task-modal"><input id="task-title" placeholder="Title"> <textarea id="task-description" placeholder="Description"></textarea> <input type="date" id="task-duedate"> <select id="task-priority"><option value="Low">Low</option><option value="Medium">Medium</option><option value="High">High</option></select> <button id="task-save-btn">Save</button> <button id="task-cancel-btn">Cancel</button></dialog><dialog id="todo-detail-modal"><h2 id="detail-title"></h2><p id="detail-description"></p><p>Due: <span id="detail-duedate"></span></p><p>Priority: <span id="detail-priority"></span></p><button id="detail-delete-btn">Delete</button> <button id="detail-close-btn">Close</button></dialog></body></html>
